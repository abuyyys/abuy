<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perkenalan Diri - Rifqi Raziq Alfath</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .card {
                flex-direction: row;
            }
        }

        .profile-side {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
        }

        .profile-side h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .profile-side p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .content-side {
            padding: 40px 30px;
            flex: 1;
        }

        .section-title {
            font-size: 1.2rem;
            color: #1e3c72;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 8px;
            margin-bottom: 15px;
            margin-top: 20px;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .bio-text {
            color: #555;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            list-style: none;
        }

        .skills-list li {
            background: #eef2f5;
            color: #2a5298;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .contact-links {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .btn-primary {
            background-color: #1e3c72;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2a5298;
        }

        .btn-secondary {
            background-color: #eef2f5;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Sisi Kiri / Foto Profil -->
        <div class="profile-side">
            <img src="https://images.unsplash.com/photo-1531403009284-440f080d1e12?q=80&w=400" alt="Foto Profil" class="profile-img">
            <h1>Rifqi Raziq Alfath</h1>
            
            </div>
        </div>
    </div>

</body>
</html>
