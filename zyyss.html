<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal X1 TKJ1</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --spidey-red: #e62429;
      --spidey-blue: #0288d1;
      --spidey-dark: #121212;
      --spidey-yellow: #fbc02d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0a0a10 url('https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1920&auto=format&fit=crop') center/cover fixed;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 16, 0.85);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: 3.5rem;
      color: var(--spidey-red);
      text-shadow: 3px 3px 0 #000, -2px -2px 0 var(--spidey-blue), 5px 5px 15px rgba(230, 36, 41, 0.6);
      letter-spacing: 2px;
      margin-bottom: 5px;
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }

    .subtitle {
      font-size: 1.1rem;
      color: #ffeb3b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Spider Hero Gallery Top */
    .hero-gallery {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .hero-card {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid var(--spidey-red);
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(230, 36, 41, 0.5);
      transition: all 0.3s ease;
      background: #000;
    }

    .hero-card:hover {
      transform: scale(1.2) rotate(5deg);
      border-color: var(--spidey-yellow);
      box-shadow: 0 0 25px var(--spidey-yellow);
    }

    .hero-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Days Tab Navigation */
    .days-nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .day-btn {
      font-family: 'Bangers', cursive;
      font-size: 1.5rem;
      padding: 10px 25px;
      border: none;
      background: #1e1e2f;
      color: #fff;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      letter-spacing: 1px;
    }

    .day-btn:hover, .day-btn.active {
      background: var(--spidey-red);
      color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(230, 36, 41, 0.7);
    }

    /* Schedule Content Grid */
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .subject-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .subject-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 6px; height: 100%;
      background: var(--spidey-blue);
    }

    .subject-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--spidey-red);
      box-shadow: 0 10px 30px rgba(230, 36, 41, 0.4);
      background: rgba(255, 255, 255, 0.1);
    }

    .subject-time {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--spidey-yellow);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .subject-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .subject-desc {
      font-size: 0.85rem;
      color: #bbb;
    }

    .spider-icon {
      position: absolute;
      right: 15px;
      bottom: 15px;
      width: 45px;
      height: 45px;
      opacity: 0.8;
      transition: transform 0.3s;
    }

    .subject-card:hover .spider-icon {
      transform: scale(1.3) rotate(-10deg);
      opacity: 1;
    }

    /* Modal Detail Interactive */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #181824;
      border: 3px solid var(--spidey-red);
      border-radius: 20px;
      max-width: 450px;
      width: 100%;
      padding: 25px;
      text-align: center;
      position: relative;
      box-shadow: 0 0 30px rgba(230, 36, 41, 0.8);
      animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 15px;
      border: 2px solid var(--spidey-blue);
    }

    .modal-title {
      font-family: 'Bangers', cursive;
      font-size: 2rem;
      color: var(--spidey-yellow);
      margin-bottom: 10px;
    }

    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      background: var(--spidey-red);
      color: white;
      border: none;
      width: 35px; height: 35px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.2rem;
    }

    /* Web Canvas Effect */
    #web-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 99;
    }

    /* Copyright Style */
    .copyright {
      text-align: center;
      margin-top: 50px;
      padding-bottom: 20px;
      font-size: 0.9rem;
      color: #bbb;
      letter-spacing: 1px;
    }

    .copyright strong {
      color: var(--spidey-red);
      font-family: 'Bangers', cursive;
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-shadow: 1px 1px 0 #000;
    }
  </style>
</head>
<body>

  <canvas id="web-canvas"></canvas>

  <div class="container">
    <header>
      <h1>JADWAL PELAJARAN KELAS X1 TKJ1</h1>
    </header>

    <!-- Character Selector / Gallery -->
    <div class="hero-gallery">
      <div class="hero-card" onclick="triggerWeb('Peter Parker')">
        <img src="https://images.unsplash.com/photo-1635863138275-d9b33299680b?q=80&w=300&auto=format&fit=crop" alt="Classic Spidey">
      </div>
      <div class="hero-card" onclick="triggerWeb('Miles Morales')">
        <img src="https://images.unsplash.com/photo-1604200213928-ba3cf4fc8436?q=80&w=300&auto=format&fit=crop" alt="Miles Morales">
      </div>
      <div class="hero-card" onclick="triggerWeb('Gwen Stacy')">
        <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=300&auto=format&fit=crop" alt="Spider Gwen">
      </div>
      <div class="hero-card" onclick="triggerWeb('Spider-Man 2099')">
        <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=300&auto=format&fit=crop" alt="Spider-Man 2099">
      </div>
    </div>

    <!-- Day Buttons -->
    <div class="days-nav">
      <button class="day-btn active" onclick="showDay('senin', this)">SENIN</button>
      <button class="day-btn" onclick="showDay('selasa', this)">SELASA</button>
      <button class="day-btn" onclick="showDay('rabu', this)">RABU</button>
      <button class="day-btn" onclick="showDay('kamis', this)">KAMIS</button>
      <button class="day-btn" onclick="showDay('jumat', this)">JUMAT</button>
    </div>

    <!-- Schedule Cards Grid -->
    <div class="schedule-grid" id="schedule-container">
      <!-- Generated by JavaScript -->
    </div>

    <!-- Copyright by Zyyck -->
    <div class="copyright">
      &copy; 2026 Created by <strong>Zyyck</strong>. All Rights Reserved.
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <img id="modalImg" class="modal-img" src="" alt="Subject Image">
      <h2 id="modalTitle" class="modal-title"></h2>
      <p id="modalTime" style="color: var(--spidey-yellow); font-weight: 600; margin-bottom: 10px;"></p>
      <p id="modalDesc" style="color: #ddd; font-size: 0.95rem; line-height: 1.5;"></p>
    </div>
  </div>

  <script>
    const schedules = {
      senin: [
        { time: "07.40 - 09.00", title: "Muatan Lokal (Mulok)", desc: "Pembelajaran muatan lokal daerah.", img: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?q=80&w=500" },
        { time: "09.00 - 10.40", title: "Olahraga", desc: "Latihan fisik dan olahraga pahlawan.", img: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?q=80&w=500" },
        { time: "10.40 - 12.00", title: "KK-TKJ", desc: "Konsentrasi Keahlian Teknik Komputer & Jaringan.", img: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=500" },
        { time: "13.00 - 14.20", title: "Sejarah", desc: "Sejarah dan asal-usul peristiwa penting.", img: "https://images.unsplash.com/photo-1461360370896-922624d12aa1?q=80&w=500" },
        { time: "14.20 - 15.40", title: "KK-TKJ", desc: "Praktik lanjutan Teknik Komputer & Jaringan.", img: "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=500" }
      ],
      selasa: [
        { time: "07.40 - 09.00", title: "PPKn", desc: "Pendidikan Pancasila & Kewarganegaraan.", img: "https://images.unsplash.com/photo-1541872703-74c5e44368f9?q=80&w=500" },
        { time: "09.00 - 11.20", title: "KK-TKJ", desc: "Sistem Jaringan & Konfigurasi Perangkat.", img: "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?q=80&w=500" },
        { time: "11.20 - 15.40", title: "PKK", desc: "Produk Kreatif & Kewirausahaan Teknologi.", img: "https://images.unsplash.com/photo-1519389950473-47ba0277781c?q=80&w=500" }
      ],
      rabu: [
        { time: "07.40 - 10.40", title: "Bahasa Inggris", desc: "Komunikasi dan literasi teknologi internasional.", img: "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?q=80&w=500" },
        { time: "10.40 - 12.00", title: "Bahasa Indonesia", desc: "Tata bahasa dan pembuatan dokumen teknis.", img: "https://images.unsplash.com/photo-1457369804613-52c61a468e7d?q=80&w=500" },
        { time: "13.00 - 15.40", title: "KK-TKJ", desc: "Praktikum Laboratorium Jaringan Komputer.", img: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=500" }
      ],
      kamis: [
        { time: "07.20 - 09.00", title: "KK-TKJ", desc: "Pengenalan infrastruktur dan kabel jaringan.", img: "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=500" },
        { time: "09.00 - 11.20", title: "Matematika", desc: "Logika matematika & kalkulasi data.", img: "https://images.unsplash.com/photo-1509228468518-180dd4864904?q=80&w=500" },
        { time: "11.20 - 14.20", title: "PABP", desc: "Pendidikan Agama & Budi Pekerti.", img: "https://images.unsplash.com/photo-1507692049790-de58290a4334?q=80&w=500" },
        { time: "14.20 - 15.40", title: "KK-TKJ", desc: "Pemeliharaan & Troubleshooting Komputer.", img: "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?q=80&w=500" }
      ],
      jumat: [
        { time: "07.40 - 10.40", title: "KK-TKJ", desc: "Sistem Operasi Jaringan & Server.", img: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=500" },
        { time: "10.40 - 15.00", title: "MPP-TKJ", desc: "Mata Pelajaran Pilihan / Pengayaan TKJ.", img: "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?q=80&w=500" }
      ]
    };

    const spideyImages = [
      "https://images.unsplash.com/photo-1635863138275-d9b33299680b?q=80&w=200",
      "https://images.unsplash.com/photo-1604200213928-ba3cf4fc8436?q=80&w=200",
      "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=200"
    ];

    function showDay(day, btn) {
      document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');

      const container = document.getElementById('schedule-container');
      container.innerHTML = '';

      schedules[day].forEach((item, index) => {
        const randomImg = spideyImages[index % spideyImages.length];
        const card = document.createElement('div');
        card.className = 'subject-card';
        card.onclick = () => openModal(item.title, item.time, item.desc, item.img);

        card.innerHTML = `
          <div class="subject-time">⏰ ${item.time}</div>
          <div class="subject-title">${item.title}</div>
          <div class="subject-desc">${item.desc}</div>
          <img class="spider-icon" src="${randomImg}" alt="Spidey">
        `;
        container.appendChild(card);
      });
    }

    function openModal(title, time, desc, img) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalTime').innerText = '⏰ ' + time;
      document.getElementById('modalDesc').innerText = desc;
      document.getElementById('modalImg').src = img;
      document.getElementById('detailModal').style.display = 'flex';
      shootWebEffect();
    }

    function closeModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    // Effect Tembakan Jaring Laba-laba Canvas
    const canvas = document.getElementById('web-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.onresize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    };

    function shootWebEffect() {
      ctx.clearRect(0,0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 2;

      const startX = Math.random() > 0.5 ? 0 : canvas.width;
      const startY = canvas.height;
      const targetX = canvas.width / 2;
      const targetY = canvas.height / 2;

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(targetX, targetY);
      ctx.stroke();

      setTimeout(() => {
        ctx.clearRect(0,0, canvas.width, canvas.height);
      }, 300);
    }

    function triggerWeb(heroName) {
      shootWebEffect();
      alert("🕸️ Karakter Dipilih: " + heroName + "! 'With great power comes great responsibility!'");
    }

    // Load Default
    showDay('senin');
  </script>
</body>
</html>
